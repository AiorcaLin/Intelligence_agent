template:
  name: "加密市场速报"
  description: "加密货币市场全景速览，涵盖价格、市值、交易量等核心指标"
  domain: "Crypto"
  creator_type: "system"
  version: 1

prompt_config:
  collection_weights:
    CoinGecko: 0.4
    DeFiLlama: 0.15
    Etherscan: 0.15
    Messari: 0.2
    Google News: 0.1
  filtering:
    min_relevance_score: 6
    max_age_hours: 24
    dedup_window_hours: 12
    focus_keywords: ["BTC", "ETH", "market cap", "volume", "价格", "涨跌", "交易量", "市值"]
    exclude_keywords: []
  output:
    analysis_framework: "市场概况 → 价格异动 → 资金流向 → 风险提示"
    tone: "数据驱动，客观中立"
    language: "zh-CN"
    sections:
      - "市场总览"
      - "主流币动态"
      - "异动预警"
      - "风险与机会"
